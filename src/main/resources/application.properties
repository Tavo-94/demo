spring.application.name=demo-service

SPLUNK_HEC_URL=http://localhost:8088
SPLUNK_HEC_TOKEN=6c2439e8-874f-474c-8397-f924548296b2

spring.datasource.url=jdbc:postgresql://localhost:5433/transaction_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.datasource.hikari.pool-name=TransactionDBPool
logging.level.com.zaxxer.hikari.pool.HikariPool=DEBUG

management.endpoints.web.exposure.include=health,metrics,prometheus
